name: OwnTake checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk xvfb
      - run: npm ci
      - run: npm run check
      - run: xvfb-run --auto-servernum npm run smoke:desktop
        env:
          OWNTAKE_DESKTOP_TEST_NO_SANDBOX: '1'
          OWNTAKE_DESKTOP_SCREENSHOT: test-results/desktop-linux.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-linux-preview
          path: test-results/*.png
          if-no-files-found: ignore
  mac-desktop:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install FFmpeg with subtitle support
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: node scripts/release/prepare-font.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run smoke:desktop
        env:
          OWNTAKE_DESKTOP_SCREENSHOT: test-results/desktop-mac.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-mac-preview
          path: test-results/*.png
          if-no-files-found: ignore
  desktop-packages:
    uses: ./.github/workflows/desktop-packages.yml
    # Pull requests receive no signing or publication secrets.
