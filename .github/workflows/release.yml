name: Release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, exactly matching package.json (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tag and source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { assertReleaseTag } from './scripts/release/targets.mjs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(tag ?? '')) throw new Error('Invalid version tag');
          const commit = execFileSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim();
          execFileSync('git', ['merge-base', '--is-ancestor', commit, 'origin/main']);
          execFileSync('git', ['checkout', '--detach', commit]);
          assertReleaseTag(tag, JSON.parse(readFileSync('package.json', 'utf8')).version);
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\ncommit=${commit}\n`);
          JS
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm ci
      - run: npm run check
  packages:
    needs: verify
    uses: ./.github/workflows/desktop-packages.yml
    with:
      ref: ${{ needs.verify.outputs.commit }}
    secrets: inherit
  draft:
    needs: [verify, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: package-downloads
      - name: Verify and assemble the release
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          node scripts/release/assemble.mjs --tag "$RELEASE_TAG"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('release-ready/release-manifest.json','utf8'));
          if (manifest.commit !== process.env.RELEASE_COMMIT) throw new Error('Release source changed');
          JS
      - name: Upload a complete draft without publishing or overwriting a previous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release for this tag already exists; no assets will be overwritten.' >&2
            exit 1
          fi
          mapfile -t assets < <(find release-ready -maxdepth 1 -type f ! -name release-notes.md | sort)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --title "OwnTake $RELEASE_TAG" --notes-file release-ready/release-notes.md
          echo 'Draft created. Review concrete release notes and signing disclosures before publishing.'
