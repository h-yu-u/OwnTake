name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, exactly matching package.json (for example v0.1.0)'
        required: true
        type: string
      create_tag:
        description: 'Create a missing tag from the selected main commit only after all package checks pass'
        type: boolean
        default: false
      publish:
        description: 'Publish after verifying every uploaded asset (off leaves a verified draft)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      create_tag: ${{ steps.source.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tag and source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_CREATE_TAG: ${{ inputs.create_tag || false }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SELECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { assertReleaseTag } from './scripts/release/targets.mjs';
          import { planReleaseSource } from './scripts/release/publish.mjs';
          const tag = process.env.RELEASE_TAG;
          assertReleaseTag(tag, typeof tag === 'string' ? tag.slice(1) : undefined);
          const lookup = spawnSync('git', ['rev-parse', '--verify', '--quiet', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' });
          if (lookup.status !== 0 && lookup.status !== 1) throw new Error('Could not inspect the version tag');
          const source = planReleaseSource({
            tag, eventName: process.env.RELEASE_EVENT, ref: process.env.RELEASE_REF,
            selectedCommit: process.env.RELEASE_SELECTED_COMMIT,
            existingTagCommit: lookup.status === 0 ? lookup.stdout.trim() : null,
            createTag: process.env.RELEASE_CREATE_TAG === 'true',
          });
          const { commit } = source;
          execFileSync('git', ['merge-base', '--is-ancestor', commit, 'origin/main']);
          execFileSync('git', ['checkout', '--detach', commit]);
          assertReleaseTag(tag, JSON.parse(readFileSync('package.json', 'utf8')).version);
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\ncommit=${commit}\ncreate_tag=${source.createTag}\n`);
          JS
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm ci
      - run: npm run check
  packages:
    needs: verify
    uses: ./.github/workflows/desktop-packages.yml
    with:
      ref: ${{ needs.verify.outputs.commit }}
    secrets: inherit
  publish:
    needs: [verify, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: package-downloads
      - name: Verify and assemble the release
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          node scripts/release/assemble.mjs --tag "$RELEASE_TAG"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('release-ready/release-manifest.json','utf8'));
          if (manifest.commit !== process.env.RELEASE_COMMIT) throw new Error('Release source changed');
          JS
      - name: Upload, verify and finish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_CREATE_TAG: ${{ needs.verify.outputs.create_tag }}
        run: node scripts/release/publish.mjs
